# Sillon — configuration Netlify : site statique + fonction /api/claude + formulaires.
[build]
  publish = "."
  command = "echo 'Site statique, pas de compilation'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Le site est publié depuis la racine du dépôt (publish = ".") : sans ces règles, le code des
# fonctions, le schéma SQL, les tests, la documentation interne et les anciennes archives
# étaient téléchargeables publiquement (constaté le 18/11/2026 sur staging et en production).
# Solution durable : publier un dossier dédié ne contenant que le site.
[[redirects]]
  from = "/netlify/*"
  to = "/introuvable"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/introuvable"
  status = 404
  force = true

