# Bloquer l'accès HTTP aux éléments internes du dépôt publiés par erreur.
# Les fonctions Netlify sont exécutées côté serveur et ne doivent jamais être servies comme fichiers statiques.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sillon-v5/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Archives, schémas SQL, secrets et fichiers de configuration internes.
[[redirects]]
  from = "/*.zip"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/**/*.zip"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/**/*.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/**/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sillon-v5/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Sillon — configuration Netlify : site statique + fonction /api/claude + formulaires.
[build]
  publish = "."
  command = "echo 'Site statique, pas de compilation'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
